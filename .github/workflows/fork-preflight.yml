name: Fork preflight

on:
  workflow_dispatch:
    inputs:
      tested_sha:
        description: Full contribution commit SHA to validate
        required: true
        type: string
      base_sha:
        description: Full upstream base commit SHA
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        kiota-http-version: ['1.13.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tested_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tested and base commits
        env:
          TESTED_SHA: ${{ inputs.tested_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          test "$(git merge-base HEAD origin/main)" = "$BASE_SHA"
          git rev-parse HEAD
          git merge-base HEAD origin/main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        env:
          KIOTA_HTTP_VERSION: ${{ matrix.kiota-http-version }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install "microsoft-kiota-http==$KIOTA_HTTP_VERSION"
          pip install .
          pip check
      - name: Check format
        run: yapf -dr src
      - name: Check changed imports
        run: isort --check-only src/msgraph_core/middleware/async_graph_transport.py tests/middleware/test_async_graph_transport.py
      - name: Static type checking
        run: mypy src
      - name: Lint
        run: pylint src --disable=W --rcfile=.pylintrc
      - name: Test
        run: pytest
      - name: Build package
        run: python -m build

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tested_sha }}
          persist-credentials: false
      - name: Verify tested commit
        env:
          TESTED_SHA: ${{ inputs.tested_sha }}
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: python
      - uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
